spring.application.name=billbull-backend-demo
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/billbull_demo
spring.datasource.username=postgres
spring.datasource.password=root

upload.path=uploads/demo/

jwt.secret=${JWT_SECRET_DEMO:demo-secret-key-32chars-minimum!!!}
jwt.expiration=86400000

financials.jv.approval-threshold-aed=10000

spring.flyway.enabled=true 

# Business Day timezone for this tenant (billbull_demo / UAE). Set EXPLICITLY here rather than
# inherited from application.properties: an inherited value is how a UAE tenant would
# silently trade on the wrong Business Day. See BusinessDayClock — this is the single
# Business Day clock, and an unresolvable zone fails startup rather than falling back.
pos.businessday.timezone=Asia/Dubai
