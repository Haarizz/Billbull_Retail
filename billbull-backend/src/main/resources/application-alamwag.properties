spring.application.name=billbull-backend-alamwag
server.port=8083

# ===============================
# DATABASE - Al Amwag Computer
# ===============================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/billbull_alamwag
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# File Upload
# ===============================
upload.path=uploads/alamwag/

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET_ALAMWAG}
jwt.expiration=86400000

# ===============================
# Financials
# ===============================
financials.jv.approval-threshold-aed=10000

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# Business Day
# ===============================
pos.businessday.timezone=Asia/Dubai