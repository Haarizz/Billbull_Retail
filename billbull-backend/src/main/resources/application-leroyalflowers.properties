spring.application.name=billbull-backend-leroyalflowers
server.port=8081

# ===============================
# DATABASE - Le Royal Flowers
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/billbull_leroyalflowers
spring.datasource.username=postgres
spring.datasource.password=root

# ===============================
# File Upload
# ===============================
upload.path=uploads/leroyalflowers/

# ===============================
# JWT (set unique secret per client via environment variable)
# ===============================
jwt.secret=${JWT_SECRET_LEROYALFLOWERS:leroyalflowers-secret-key-32chars-minimum!!!}
jwt.expiration=86400000

# ===============================
# Financials
# ===============================
financials.jv.approval-threshold-aed=10000


# Disable Flyway for fresh databases — let Hibernate create schema first
spring.flyway.enabled=true

# Business Day timezone for this tenant (billbull_leroyalflowers / UAE). Set EXPLICITLY here rather than
# inherited from application.properties: an inherited value is how a UAE tenant would
# silently trade on the wrong Business Day. See BusinessDayClock — this is the single
# Business Day clock, and an unresolvable zone fails startup rather than falling back.
pos.businessday.timezone=Asia/Dubai
