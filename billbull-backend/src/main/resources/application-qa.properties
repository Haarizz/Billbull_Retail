server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/billbull_qa
spring.datasource.username=postgres
spring.datasource.password=root

# Business Day timezone for this tenant (billbull_qa / India). Set EXPLICITLY here rather than
# inherited from application.properties: an inherited value is how a India tenant would
# silently trade on the wrong Business Day. See BusinessDayClock — this is the single
# Business Day clock, and an unresolvable zone fails startup rather than falling back.
pos.businessday.timezone=Asia/Kolkata
