spring.application.name=billbull-backend-alfahad
server.port=8081

# ===============================
# DATABASE - Al Fahad
# ===============================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/billbull_alfahad
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# File Upload
# ===============================
upload.path=uploads/alfahad/

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET_ALFAHAD}
jwt.expiration=86400000

# ===============================
# Financials
# ===============================
financials.jv.approval-threshold-aed=10000

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# Business Day
# ===============================
pos.businessday.timezone=Asia/Dubai