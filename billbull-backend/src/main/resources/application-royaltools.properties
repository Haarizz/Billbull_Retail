spring.application.name=billbull-backend-royaltools
server.port=8080

# ===============================
# DATABASE - Royal Tools
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/billbull_royaltools
spring.datasource.username=postgres
spring.datasource.password=root

# ===============================
# File Upload
# ===============================
upload.path=uploads/royaltools/

# ===============================
# JWT (set unique secret per client via environment variable)
# ===============================
jwt.secret=${JWT_SECRET_ROYALTOOLS:royaltools-secret-key-32chars-minimum!!!}
jwt.expiration=86400000

# ===============================
# Financials
# ===============================
financials.jv.approval-threshold-aed=10000

# Disable Flyway for fresh databases — let Hibernate create schema first
spring.flyway.enabled=true

# Business Day timezone for this tenant (billbull_royaltools / UAE). Set EXPLICITLY here rather than
# inherited from application.properties: an inherited value is how a UAE tenant would
# silently trade on the wrong Business Day. See BusinessDayClock — this is the single
# Business Day clock, and an unresolvable zone fails startup rather than falling back.
pos.businessday.timezone=Asia/Dubai

# ===============================
# Flyway
# ===============================
spring.flyway.locations=classpath:db/migration,classpath:db/migration-royaltools
# Royaltools applied its tenant-only V9001 while the shared scripts were at V83, so every later
# shared migration (V84+) sits below the applied max and would be silently skipped. Out-of-order
# lets those lower versions apply. Shared scripts are idempotent, so running them late is safe.
spring.flyway.out-of-order=true

# ===============================
# TEMPORARY — one-off Sales Return GL backfill. REMOVE THIS BLOCK once verified.
# ===============================
# Eight returns approved before the Phase 2 settlement work posted their revenue/VAT reversal
# (Cr 1100) but never wrote the {SR}-RFND settlement leg, so 1100 still carries 1,049.00 of
# credit for money that physically left the business while 1013 / 1010 never moved.
#
# Posting dates are each return's own date (18 Aug – 26 Sep): posting-date is deliberately
# NOT set, because every 2026 accounting period is Open, so the honest dates are postable.
# August and September figures therefore change — finance must know before the run.
#
# reverse-inventory-returns is deliberately absent. Six of these returns also hold a
# {SR}-INV entry debiting 1200 for stock that never arrived (883.83), but which of them had
# no goods come back is a question only the branch can answer, so nothing is listed yet.
#
# SR-2026-0009 and SR-2026-0010 are deliberately absent too: their invoices still carry a
# full balance, so the returns have no paid portion and the runner refuses them by design.
# They need an accounting decision first. See docs/ for the full analysis.
salesreturn.gl-backfill.enabled=true
salesreturn.gl-backfill.dry-run=true
salesreturn.gl-backfill.settle-returns=SR-2026-0001,SR-2026-0002,SR-2026-0003,SR-2026-0004,SR-2026-0005,SR-2026-0006,SR-2026-0007,SR-2026-0008

