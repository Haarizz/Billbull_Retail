spring.application.name=billbull-backend-bikevillage
server.port=8082

# ===============================
# DATABASE - Bike Village
# ===============================
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/billbull_bikevillage
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# File Upload
# ===============================
upload.path=uploads/bikevillage/

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET_BIKEVILLAGE}
jwt.expiration=86400000

# ===============================
# Financials
# ===============================
financials.jv.approval-threshold-aed=10000

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

# ===============================
# Business Day
# ===============================
pos.businessday.timezone=Asia/Dubai