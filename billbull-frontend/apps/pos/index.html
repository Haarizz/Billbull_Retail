<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../../packages/shared/src/assets/billBullFavicon.png" />
    <title>BillBull POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: a render-blocking stylesheet from the internet kept the till white for
         seconds on every load (sign-out reloads the page). Text swaps to Inter once it arrives. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" /></noscript>
    <style>
      /* Boot splash: painted with the HTML, replaced when React renders into #root. */
      .pos-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #1E293B; background: linear-gradient(180deg, #FFF8E7 0%, #ffffff 100%); }
      .pos-boot__mark { width: 64px; height: 64px; border-radius: 18px; background: #F5C742; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 22px; letter-spacing: 0.5px; box-shadow: 0 8px 24px rgba(245, 199, 66, 0.35); }
      .pos-boot__title { font-size: 18px; font-weight: 700; }
      .pos-boot__spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #FDE6A9; border-top-color: #b8920e; animation: pos-boot-spin 0.8s linear infinite; }
      @keyframes pos-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pos-boot__spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pos-boot" role="status" aria-label="Loading BillBull POS">
        <div class="pos-boot__mark">BB</div>
        <div class="pos-boot__title">BillBull POS</div>
        <div class="pos-boot__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
