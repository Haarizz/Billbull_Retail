# BillBull standalone POS (/pos/) — add inside each tenant's existing `server { ... }` block for
# the 443 vhost, next to (before) the existing `location / { try_files $uri $uri/ /index.html; }`.
# The existing `location /`, `/assets/`, `/uploads/` and `/api/` blocks stay exactly as they are.
#
# The bundle lives OUTSIDE /var/www/billbull because the Retail update step runs
# `rm -rf /var/www/billbull/*`. Install it so the files sit under a `pos/` folder:
#   /var/www/billbull-pos/pos/index.html
#   /var/www/billbull-pos/pos/assets/...
# (`root` + that folder avoids nginx's alias/try_files pitfalls.)
#
# One bundle serves every tenant on the server: it holds no tenant name, host, port or database,
# and calls the same-origin /api/ that this vhost already proxies to the tenant's backend.

# Bare /pos → /pos/
location = /pos {
    return 301 /pos/;
}

# The app shell must never be cached, so a deploy is picked up on the next load.
location = /pos/index.html {
    root /var/www/billbull-pos;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# Content-hashed bundles: cache forever; a missing file is a real 404, never the app shell.
location ^~ /pos/assets/ {
    root /var/www/billbull-pos;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Client-side routes (/pos/, /pos/login, ...) fall back to the app shell above.
location ^~ /pos/ {
    root /var/www/billbull-pos;
    try_files $uri /pos/index.html;
}
