# admin.billbull.app — BillBull Platform Control Center.
# /etc/nginx/sites-available/billbull-admin  →  ln -s into sites-enabled, then nginx -t && systemctl reload nginx
#
# Serves the admin SPA (billbull-frontend/apps/admin/dist) and proxies /api/ to the platform service
# (billbull-platform, 127.0.0.1:8095). It is a separate vhost and root: nothing here touches a tenant
# vhost, /var/www/billbull or /var/www/billbull-pos.

server {
    listen 80;
    server_name admin.billbull.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.billbull.app;

    ssl_certificate /etc/letsencrypt/live/admin.billbull.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.billbull.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Optional but recommended: only BillBull office / VPN addresses may open the control plane.
    # allow 203.0.113.0/24;
    # deny all;

    root /var/www/billbull-admin;
    index index.html;
    client_max_body_size 1M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # The backup script on each server reports here (token-authenticated). Keep it reachable from
    # the servers even if the allow-list above is enabled:
    location = /api/backups/report {
        # allow <VPS1 IP>; allow <VPS2 IP>; allow <VPS3 IP>; deny all;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator stays internal.
    location /actuator/ { return 404; }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri /index.html;
    }
}
