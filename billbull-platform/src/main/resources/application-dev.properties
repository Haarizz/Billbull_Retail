# Local development only (--spring.profiles.active=dev). Never use on a server.
# Without PLATFORM_JWT_SECRET / PLATFORM_ENC_KEY the dev profile generates throwaway keys at
# startup, so every restart signs everyone out and old agent secrets can't be decrypted.
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/billbull_platform_dev}
spring.datasource.username=${PLATFORM_DB_USERNAME:postgres}
platform.security.require-mfa=${PLATFORM_REQUIRE_MFA:true}
platform.cors.allowed-origins=${PLATFORM_CORS_ALLOWED_ORIGINS:http://localhost:5175}
platform.health.poll-interval-ms=60000
