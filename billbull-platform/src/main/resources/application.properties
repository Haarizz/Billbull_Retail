# BillBull Platform (admin.billbull.app) — defaults. Every secret comes from the service
# environment (/etc/billbull/platform.env in production); none belongs in this file.
spring.application.name=billbull-platform
server.port=${PLATFORM_PORT:8095}
server.forward-headers-strategy=native

# Own database — never a tenant database.
spring.datasource.url=${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/billbull_platform}
spring.datasource.username=${PLATFORM_DB_USERNAME:billbull_platform}
spring.datasource.password=${PLATFORM_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1

# Flyway owns the schema from version 1; Hibernate only checks it matches.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/platform
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# --- Security ---------------------------------------------------------------------------------
# PLATFORM_JWT_SECRET and PLATFORM_ENC_KEY are required (>= 32 chars) unless the 'dev' profile is
# active. See docs/superadmin/SECURITY.md.
platform.security.jwt-ttl-minutes=480
platform.security.require-mfa=true
platform.security.login.max-failures=5
platform.security.login.lockout-minutes=15
platform.security.login.ip-per-minute=20
# Comma-separated browser origins allowed to call this API cross-origin (dev servers only).
# In production the admin SPA is served from the same origin, so leave this empty.
platform.cors.allowed-origins=${PLATFORM_CORS_ALLOWED_ORIGINS:}

# --- Tenant agent calls -----------------------------------------------------------------------
platform.agent.connect-timeout-ms=4000
platform.agent.request-timeout-ms=10000
# Health poll and state sync schedules.
platform.health.poll-interval-ms=300000
platform.health.retention-days=30
platform.sync.interval-ms=60000

# --- Backups ----------------------------------------------------------------------------------
# Token the server-side backup script sends with each report (PLATFORM_BACKUP_TOKEN).
platform.backup.stale-after-hours=26

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
