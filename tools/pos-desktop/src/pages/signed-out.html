<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <title>BillBull POS – Signed out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="brand"><img class="logo" src="../assets/icon.png" alt=""><div class="brand-name">BillBull POS</div></div>
    <h1>You have been signed out</h1>
    <p>Your login on this till has ended. It may have expired, or the server no longer accepts it (for example after a server update or a password change).</p>
    <p>Sign in again to continue. An open POS session (cash drawer shift) stays open on the server.</p>
    <div class="hint">Server: <code id="server">–</code></div>
    <div class="actions">
      <button class="primary" id="signin" type="button">Sign in again</button>
      <button class="secondary" id="setup" type="button">Change server</button>
    </div>
  </main>
  <script src="signed-out.js"></script>
</body>
</html>
